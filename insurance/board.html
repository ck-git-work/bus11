<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Insurance game: scoreboard</title>
<style>
  :root {
    --navy: #1B2A49; --gold: #C8972B; --lgold: #E4B94A; --muted: #5B6475; --bg: #FFFFFF; --panel: #F3F6FA;
    --border: #8A9AB5; --tint: #F6EFD9; --slate: #4A6FA5; --debt: #8C2F2F; --rh: 30px; --fs: 20px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--navy); font: 20px/1.3 Calibri, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  #top { background: var(--navy); color: #fff; padding: 0.5vh 1.4vw; display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; flex: none; }
  #top .phase { font: 700 clamp(22px, 2.6vw, 44px) Arial, Helvetica, sans-serif; }
  #top .side { font-size: clamp(15px, 1.5vw, 26px); color: var(--lgold); text-align: right; }
  #wait { flex: none; background: var(--tint); padding: 0.4vh 1.4vw; font-size: clamp(14px, 1.3vw, 22px); display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #wait.on { display: block; }
  #off { flex: none; display: none; background: var(--debt); color: #fff; padding: 0.6vh 1.4vw; font-size: clamp(15px, 1.5vw, 26px); }
  #off.on { display: block; }
  #view { flex: 1; min-height: 0; padding: 1vh 1.4vw; display: flex; flex-direction: column; }
  #controls { flex: none; border-top: 1px solid #D5DBE5; background: var(--panel); padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 15px; }
  #controls.viewer { display: none; }
  #controls.pre { background: #FBF4DE; border-top: 3px solid var(--gold); }
  #controls .stage { font: 700 12px Arial, sans-serif; letter-spacing: .07em; text-transform: uppercase; color: var(--navy); background: #fff; border: 1px solid var(--gold); border-radius: 5px; padding: 5px 8px; }
  #controls button { font: 15px Calibri, "Segoe UI", sans-serif; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--navy); background: #fff; color: var(--navy); cursor: pointer; }
  #controls button.go { background: var(--gold); border-color: var(--gold); font-weight: 700; font-size: 17px; padding: 8px 18px; }
  #controls button.on { background: var(--navy); color: #fff; }
  #controls button.warn { border-color: var(--debt); color: var(--debt); }
  #controls .sep { width: 1px; align-self: stretch; background: #C5CCD8; margin: 0 4px; }
  #controls input { font: 15px Calibri, sans-serif; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; min-width: 300px; }
  #more { display: none; flex-basis: 100%; gap: 8px; flex-wrap: wrap; align-items: center; }
  #more.on { display: flex; }

  /* lobby */
  .lobby { display: flex; gap: 3vw; align-items: center; flex: 1; min-height: 0; }
  .lobby .qr { flex: none; text-align: center; }
  .lobby .qr img { width: min(34vw, 62vh); height: auto; image-rendering: pixelated; }
  .lobby .url { font: 700 clamp(18px, 2.2vw, 38px) Arial, sans-serif; margin-top: 1vh; word-break: break-all; }
  .lobby .names { flex: 1; align-self: stretch; display: flex; flex-direction: column; min-width: 0; }
  .lobby h1 { font: 700 clamp(28px, 3.6vw, 60px) Arial, sans-serif; margin: 0 0 1vh; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.8vw; align-content: flex-start; overflow: hidden; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 0.3vh 1.1vw; font-size: clamp(18px, 2vw, 34px); }
  .chip button { margin-left: 8px; border: none; background: none; color: var(--debt); font-size: 0.8em; cursor: pointer; }

  /* leaderboard */
  .lb { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .lb .rows { flex: 1; min-height: 0; overflow: hidden; }
  .row { display: grid; grid-template-columns: 2.2em minmax(6em, 17%) 13.2em 1fr 7em 6.2em 6.2em; align-items: center; column-gap: 0.7em; height: var(--rh); font-size: var(--fs); border-bottom: 1px solid #E3E8F0; white-space: nowrap; }
  /* Top and bottom view: one more column that says what happened to the player. */
  .row.tl { grid-template-columns: 2.2em minmax(6em, 1fr) 13.2em minmax(12em, 1.4fr) 7em 6.2em 6.2em; }
  .row.head { height: calc(var(--rh) * 1.5); align-items: end; padding-bottom: 0.12em; color: var(--muted); border-bottom: 2px solid var(--navy); }
  .row.head > div { font: 700 0.74em Arial, sans-serif; }
  .row.head > div.marks { font: inherit; align-items: end; }
  .row .tag { font-size: 0.8em; overflow: hidden; text-overflow: ellipsis; }
  .npc { font-weight: 400; font-style: normal; color: var(--muted); font-size: 0.8em; }
  .row .rank { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .name { overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  .row.house .name { font-weight: 400; font-style: italic; }
  .row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .row .num.sav { font-weight: 700; }
  .row .num.sm { color: var(--muted); }
  .neg { color: var(--debt); }
  .marks { display: flex; gap: 0.4em; align-items: center; }
  .grp { flex: none; width: 3em; display: flex; justify-content: center; align-items: center; gap: 0.5em; }
  .grp.h { flex-direction: column; gap: 0; line-height: 1.05; color: var(--navy); }
  .grp.h b { font: 700 0.86em Arial, sans-serif; }
  .grp.h small { font: 400 0.46em Arial, sans-serif; color: var(--muted); }
  .mk { width: 0.95em; height: 0.95em; border: 2px solid var(--navy); border-radius: 2px; position: relative; flex: none; }
  .mk.b { background: var(--navy); }
  .mk.b.auto { background: #9AA8C0; border-color: #9AA8C0; }
  .mk.none { border-color: #C9D0DC; border-style: dotted; }
  .mk.quiet { border: none; border-bottom: 2px solid #9AA8C0; border-radius: 0; height: 0.5em; }
  .mk.hit { outline: 0.17em solid var(--gold); outline-offset: 0.1em; }
  .bar { position: relative; height: 62%; background: var(--panel); border-radius: 3px; }
  .bar .zero { position: absolute; top: -18%; bottom: -18%; width: 2px; background: var(--navy); }
  .bar .fill { position: absolute; top: 0; bottom: 0; background: var(--slate); border-radius: 2px; }
  .bar .fill.neg { background: var(--debt); }
  .row.house .bar .fill { background: #9AA8C0; }
  .row.house .bar .fill.neg { background: #C79A9A; }
  .row.mid { color: var(--muted); font-style: italic; background: var(--panel); }
  .row.mid .between { grid-column: 2 / -1; }
  .row .x { border: none; background: none; color: var(--debt); cursor: pointer; font-size: 0.8em; padding: 0 0.3em; }
  .foot { flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.4vh 2vw; padding-top: 0.6vh; font-size: clamp(15px, 1.5vw, 26px); }
  .foot b { font-variant-numeric: tabular-nums; }
  .legend { color: var(--muted); display: flex; gap: 1.2em; align-items: center; font-size: 0.8em; white-space: nowrap; }
  .legend .mk { font-size: 0.9em; }

  /* summary and question */
  .sum { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 0.8vh; font-size: clamp(15px, min(2vw, 3vh), 36px); overflow: hidden; }
  .sum section { border-top: 1px solid #C5CCD8; padding-top: 1vh; display: flex; flex-direction: column; gap: 0.7vh; }
  .sum section p { margin: 0; }
  .sum .lab { font: 700 0.62em Arial, sans-serif; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .cd .k2 { font: 700 0.74em Arial, sans-serif; color: var(--muted); }
  .wg { width: 100%; border-collapse: collapse; }
  .wg th { text-align: left; font: 700 0.62em Arial, sans-serif; color: var(--muted); border-bottom: 2px solid var(--navy); padding: 0.5vh 0.8em 0.5vh 0; vertical-align: bottom; }
  .wg td { padding: 1.1vh 0.8em 1.1vh 0; border-bottom: 1px solid #D5DBE5; white-space: nowrap; }
  .wg td.n { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; padding-right: 2.2em; }
  .sum h1 { font: 700 1.5em Arial, sans-serif; margin: 0; }
  .sum > p { margin: 0; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4vw; }
  .cd { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.2vh 1.4vw; }
  .cd .k { font: 700 0.62em Arial, sans-serif; color: var(--muted); letter-spacing: .04em; }
  .cd .v { font: 700 1.5em Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .cd .who { font-weight: 700; }
  .cd p { margin: 0.3vh 0; }
  .rc { width: 100%; border-collapse: collapse; font-size: 0.86em; margin: 0.4vh 0; }
  .rc td { padding: 0.15vh 0; vertical-align: baseline; }
  .rc td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 0.6em; }
  .rc tr.t td { border-top: 2px solid var(--navy); font-weight: 700; }
  .rc .nt { font-weight: 400; color: var(--muted); font-size: 0.86em; }
  .cd p.sm { font-size: 0.74em; color: var(--muted); }
  /* distribution */
  .spread { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .spread h1 { font: 700 clamp(22px, 2.6vw, 46px) Arial, sans-serif; margin: 0 0 0.4vh; flex: none; }
  .spread .plot { flex: 1; min-height: 0; }
  .spread svg { display: block; }
  .spread text { font-family: Calibri, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--navy); }
  .three { grid-template-columns: 1fr 1fr 1fr; }
  .four { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .qv .split { margin: 0; }
  /* the opening scene */
  .scene { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 3vh; font-size: clamp(22px, min(3vw, 4.6vh), 56px); }
  .scene h1 { font: 700 1.45em/1.15 Arial, sans-serif; margin: 0; }
  .scene p { margin: 0; }
  .scene .rc { font-size: 1em; max-width: 30em; }
  .scene .rc td { padding: 0.6vh 0; }
  .scene .who { font-size: 1.25em; }
  .scene .b { font-weight: 700; }
  .scene .cmp { border-collapse: collapse; width: 100%; max-width: 32em; }
  .scene .cmp th { font: 700 0.72em Arial, sans-serif; text-align: right; vertical-align: bottom; padding: 0 0 0.8vh 1.2em; border-bottom: 2px solid var(--navy); }
  .scene .cmp td { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding: 0.8vh 0 0.8vh 1.2em; }
  .scene .cmp th:first-child, .scene .cmp td:first-child { text-align: left; padding-left: 0; }
  .scene .cmp tr.t td { border-top: 2px solid var(--navy); font-weight: 700; }
  .scene .cmp .neg { color: var(--debt); }
  .scene .def { font-size: 1.12em; }
  .scene .terms { border-collapse: collapse; font-size: 0.82em; }
  .scene .terms td { padding: 0.5vh 1.4em 0.5vh 0; vertical-align: baseline; }
  .scene .terms td:first-child { font-weight: 700; white-space: nowrap; }
  #controls .math { font-size: 15px; }
  #controls .math.neg { font-weight: 700; }
  .qv { flex: 1; display: flex; flex-direction: column; gap: 2vh; min-height: 0; font-size: clamp(18px, 2vw, 36px); }
  .qv h1 { font: 700 clamp(28px, 3.6vw, 62px) Arial, sans-serif; margin: 0; }
  .qv .chip { font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: clamp(20px, 2.4vw, 40px); margin: auto; text-align: center; }
</style>
</head>
<body>
<div id="top"><div class="phase" id="phase">Insurance game</div><div class="side" id="side"></div></div>
<div id="off">The scoreboard has lost its connection. Wait for this bar to clear before pressing a game button.</div>
<div id="wait"></div>
<div id="view"><div class="empty">Connecting…</div></div>
<div id="controls" class="viewer"></div>

<script type="module">
import { CONFIG, N_DECADES, money, activePlayers, leaderboard, classTotals, dealDecade, freezePicks, picksFor, closedCount } from "./game.js";
import { connect, randomId, sha256 } from "./net.js";

const HOST_HASH = "c4e23f2dbd95f33dfc2aae690a970b1fcf347055d185a32c085ff84b4d96a184";
const DEFAULT_PROMPT = CONFIG.scene.prompt;
const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const B = { host: false, gameId: null, G: null, view: "lobby", manage: false, more: false, goal: false, prompt: DEFAULT_PROMPT, lastPhase: "", showName: false, split: false, price: null };
let net, stopGame = null;

start();
async function start() {
  const key = params.get("key");
  B.host = !!key && (await sha256(key)) === HOST_HASH;
  try { net = await connect(); } catch (e) { $("view").innerHTML = `<div class="empty">Couldn't reach the database. Check the connection and reload.</div>`; return; }
  // Show a bar when the scoreboard itself is offline: a decade closed from a stale copy would
  // freeze the wrong choices, so the game buttons are blocked until the connection is back.
  let offTimer = null;
  net.onConnection((ok) => {
    clearTimeout(offTimer);
    if (ok) { B.offline = false; $("off").classList.remove("on"); }
    else offTimer = setTimeout(() => { B.offline = true; $("off").classList.add("on"); }, 2500);
  });
  const fixed = params.get("g");
  if (fixed) useGame(fixed); else net.on("current", (g) => useGame(g || null));
  window.addEventListener("resize", render);
}
function useGame(g) {
  if (stopGame) stopGame();
  B.gameId = g; B.G = null;
  if (!g) return render();
  stopGame = net.on(`games/${g}`, (v) => { B.G = v; autoView(); render(); });
}

// ---------- reading the game ----------
const G = () => B.G || {};
const meta = () => G().meta || null;
const state = () => ({ choices: G().choices || {}, results: G().results || {} });
const players = () => G().players || {};
function present(d) { return activePlayers(players()).filter((p) => (p.joinedDecade || 0) <= d); }
function lockedIn(d) { return present(d).filter((p) => p.test || ((state().choices[p.id] || {})[d] || {}).locked); }
function joinUrl() {
  const u = new URL("index.html", location.href); u.search = params.get("g") ? "?g=" + params.get("g") : "";
  return u.href.replace(/index\.html/, "");
}
const scene = () => G().scene || null;
function autoView() {
  const m = meta(); const q = G().question; const sc = scene();
  const sig = (m ? m.phase + m.decade : "none") + "|" + (q ? q.state + q.id : "") + "|" + (sc ? sc.id + sc.state : "");
  if (sig === B.lastPhase) return;
  B.lastPhase = sig;
  if (!m) return;
  if (q && q.state === "open") B.view = "question";
  else if (m.phase === "lobby") B.view = sc && sc.state !== "done" ? "scene" : q && q.state === "closed" ? "question" : "lobby";
  else B.view = "board";
}

// ---------- the opening scene ----------
const sceneCount = () => activePlayers(players()).length;
const evenSplit = () => (sceneCount() ? CONFIG.scene.stake / sceneCount() : 0);
// Two ready-made prices for round 2. Both follow the head count: the even split is the loss divided by
// everyone who has joined, and the second price adds a margin on top, rounded up to the next $100.
const middlePrice = () => { const a = answers(); return a.length ? median(a) : null; };
const marginPrice = () => Math.ceil((evenSplit() * (1 + CONFIG.scene.margin)) / 100) * 100;
// The price in the typing box: what Chris typed, or else the class's middle answer.
function currentPrice() {
  if (B.price !== null) return B.price;
  return middlePrice() !== null ? middlePrice() : marginPrice();
}
function priceMath(price) {
  const n = sceneCount(), kept = n * price - CONFIG.scene.stake;
  return { kept, text: `${n} × ${money(price)} = ${money(n * price)} collected, ${money(CONFIG.scene.stake)} paid: ${kept >= 0 ? "keeps " + money(kept) : "SHORT by " + money(-kept)}` };
}
function sceneHtml() {
  const sc = scene();
  if (!sc) return `<div class="empty">The opening scene hasn't started.</div>`;
  const C = CONFIG.scene, stake = C.stake;
  // 1. The setup: Chris's framing, then the warning in bold at the bottom.
  if (sc.state === "setup") return `<div class="scene"><p>${esc(C.setup)}</p><p class="b">${esc(C.warning)}</p></div>`;
  // 3. The proposal, before the question opens.
  if (sc.state === "offer") return `<div class="scene"><h1>${esc(C.offer[0])}</h1><p>${esc(C.offer[1])}</p><p class="b">${esc(C.offer[2])}</p></div>`;
  const who = (players()[sc.pid] || {}).name || "";
  const name = B.showName ? `<p class="who">It was <b>${esc(who)}</b>.</p>` : "";
  if (sc.round === 2 && sc.state === "outcome") {
    // 6. What is left of each nest egg, without insurance (round 1) and with it (round 2).
    const n = sc.n || sceneCount(), price = Number(sc.price) || 0, kept = n * price - stake;
    const left = money(stake - price);
    return `<div class="scene"><h1>${esc(C.outcome)}</h1>
      <table class="cmp">
        <tr><th>Remaining nest egg</th><th>Without insurance</th><th>With insurance</th></tr>
        <tr><td>The one who was hit</td><td>${money(0)}</td><td>${left}</td></tr>
        <tr><td>Everyone else</td><td>${money(stake)}</td><td>${left}</td></tr>
        <tr><td>The average</td><td>${money(Math.round((stake * (n - 1)) / n))}</td><td>${left}</td></tr>
        <tr class="t"><td>${esc(C.organizer)} ends with</td><td>${money(0)}</td><td class="${kept < 0 ? "neg" : ""}">${kept < 0 ? "−" : ""}${money(Math.abs(kept))}</td></tr>
      </table></div>`;
  }
  // 7. The takeaway: a definition and the key terms.
  if (sc.round === 2 && sc.state === "takeaway") return `<div class="scene"><h1>${esc(C.takeaway)}</h1><p class="def">${esc(C.definition)}</p>
      <table class="terms">${C.terms.map(([t, d]) => `<tr><td>${esc(t)}</td><td>${esc(d)}</td></tr>`).join("")}</table></div>`;
  // 5. The round 2 draw: only the phones line. The numbers wait for the outcome screen.
  if (sc.round === 2) return `<div class="scene"><h1>${esc(C.again)}</h1><p>${esc(C.hold2)}</p>${name}</div>`;
  // 2. The round 1 draw.
  return `<div class="scene"><h1>${esc(C.headline)}</h1><p>${esc(C.hold)}</p><p>${esc(C.board)}</p>${name}</div>`;
}

// ---------- what Chris can do ----------
const path = (p) => `games/${B.gameId}/${p}`;
const act = {
  async newGame() {
    const id = params.get("g") || "g" + randomId(6);
    await net.set(`games/${id}`, { meta: { phase: "lobby", decade: 0, createdAt: Date.now() } }); // replaces any old data under this id
    if (!params.get("g")) await net.set("current", id);
    Object.assign(B, { showName: false, split: false, price: null });
  },
  // Picks one player at random and tells every phone. Test players have no phone, so a real one is chosen when there is one.
  // Step one of the scene: the framing goes up on the scoreboard and on every phone. Nobody is picked yet.
  sceneSetup() { net.update(`games/${B.gameId}`, { scene: { id: Date.now(), round: 0, state: "setup" } }); },
  // Moves the scene to a talking step (the proposal, the outcome, the takeaway) without drawing again.
  sceneStep(state) { net.update(path("scene"), { state }); },
  drawScene(round, price) {
    const all = activePlayers(players()); const real = all.filter((p) => !p.test);
    const pool = real.length ? real : all;
    if (!pool.length) return;
    const sc = { id: Date.now(), round, pid: pool[Math.floor(Math.random() * pool.length)].id, state: "revealed", n: all.length };
    if (round === 2) sc.price = price;
    B.showName = false;
    net.update(`games/${B.gameId}`, { scene: sc });
  },
  openQuestion() {
    const up = { question: { state: "open", id: Date.now(), prompt: B.prompt || DEFAULT_PROMPT } };
    if (scene()) up["scene/state"] = "done"; // the phones leave the red and green screens
    net.update(`games/${B.gameId}`, up);
  },
  closeQuestion() { net.update(path("question"), { state: "closed" }); },
  hideQuestion() { net.update(path("question"), { state: "off" }); B.view = meta().phase === "lobby" ? "lobby" : "board"; render(); },
  openDecade(d) {
    const up = { "meta/phase": "open", "meta/decade": d };
    if (G().question && G().question.state === "open") up["question/state"] = "closed";
    net.update(`games/${B.gameId}`, up);
  },
  closeDecade() {
    const d = meta().decade;
    const up = {};
    // Test players (added from "More") choose at random when the decade closes.
    const choices = JSON.parse(JSON.stringify(state().choices));
    present(d).filter((p) => p.test).forEach((p) => {
      const picks = {};
      CONFIG.decades[d].offers.forEach((o) => (picks[o.id] = Math.random() < 0.6));
      choices[p.id] = choices[p.id] || {};
      choices[p.id][d] = { picks, locked: true };
      up[`choices/${p.id}/${d}`] = choices[p.id][d];
    });
    const hits = dealDecade(d, players(), choices, state().results);
    // Store the choices that were dealt, so a late tap from an offline phone can't change this decade.
    up[`results/${d}`] = { hits, picks: freezePicks(d, players(), choices), frozen: true, at: Date.now() };
    up["meta/phase"] = "closed";
    if (G().question && G().question.state === "open") up["question/state"] = "closed";
    net.update(`games/${B.gameId}`, up);
  },
  skipDecade(d) { net.update(`games/${B.gameId}`, { [`results/${d}`]: { skipped: true, at: Date.now() }, "meta/phase": "closed", "meta/decade": d }); },
  reopenDecade() { const d = meta().decade; net.update(`games/${B.gameId}`, { [`results/${d}`]: null, "meta/phase": "open" }); },
  showFinal() { net.update(`games/${B.gameId}`, { "meta/phase": "final" }); },
  backFromFinal() { net.update(`games/${B.gameId}`, { "meta/phase": "closed", "meta/decade": N_DECADES - 1 }); },
  remove(pid) { net.update(path(`players/${pid}`), { removed: true }); },
  addTest(n) {
    const up = {}; const base = activePlayers(players()).filter((p) => p.test).length;
    const d = closedCount(meta());
    for (let i = 1; i <= n; i++) up[`players/t${randomId(6)}`] = { name: "Test " + (base + i), test: true, joinedAt: Date.now(), joinedDecade: meta().phase === "open" ? meta().decade : d };
    net.update(`games/${B.gameId}`, up);
  },
  async wipe() {
    await net.remove(`games/${B.gameId}`);
    if (!params.get("g")) await net.set("current", null);
  },
};

// ---------- drawing ----------
function render() {
  drawTop();
  drawControls();
  const m = meta();
  const v = $("view");
  if (!B.gameId || !m) { v.innerHTML = `<div class="empty">${B.host ? "No game yet. Press New game below." : "The game hasn't started yet."}</div>`; return; }
  if (B.view === "lobby") v.innerHTML = lobbyHtml();
  else if (B.view === "scene") v.innerHTML = sceneHtml();
  else if (B.view === "question") v.innerHTML = questionHtml();
  else if (B.view === "summary") v.innerHTML = summaryHtml();
  else if (B.view === "spread") { v.innerHTML = `<div class="spread"><h1 id="sph"></h1><div class="plot" id="plot"></div></div>`; drawSpread(); }
  else { v.innerHTML = boardHtml(B.view === "tails"); sizeRows(); }
}

function drawTop() {
  const m = meta();
  const w = $("wait"); w.classList.remove("on");
  if (!m) { $("phase").textContent = "Insurance game"; $("side").textContent = ""; return; }
  const n = activePlayers(players()).length;
  let phase = "Insurance game", side = `${n} player${n === 1 ? "" : "s"}`;
  const dec = CONFIG.decades[m.decade];
  if (m.phase === "lobby") phase = B.view === "scene" || (scene() && B.view === "question") ? "Before the game" : "Join the game";
  else if (m.phase === "open") {
    const all = present(m.decade), done = lockedIn(m.decade);
    phase = `The ${dec.key} are open`;
    side = `${done.length} of ${all.length} locked in`;
    const doneIds = new Set(done.map((p) => p.id));
    const left = all.filter((p) => !doneIds.has(p.id)).map((p) => p.name);
    if (left.length && left.length <= 12) { w.textContent = "Still choosing: " + left.join(", "); w.classList.add("on"); }
  } else if (m.phase === "closed") {
    phase = (G().results || {})[m.decade] && G().results[m.decade].skipped ? `The ${dec.key} passed quietly` : `After the ${dec.key}: age ${dec.endAge}`;
  } else if (m.phase === "final") phase = "Age 60: how it ended";
  if (B.view === "question" && G().question) { const a = answers(); side = `${a.length} answer${a.length === 1 ? "" : "s"}`; }
  $("phase").textContent = phase; $("side").textContent = side;
}

function lobbyHtml() {
  const names = activePlayers(players()).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
  return `<div class="lobby">
    <div class="qr"><img src="qr.png" alt="QR code to join" onerror="this.style.display='none'"><div class="url">${esc(joinUrl().replace(/^https?:\/\//, ""))}</div></div>
    <div class="names"><h1>${names.length ? names.length + " in" : "Scan to join"}</h1>
      <div class="chips">${names.map((p) => `<span class="chip">${esc(p.name)}${B.host && B.manage ? `<button data-act="remove" data-id="${p.id}" title="Remove">✕</button>` : ""}</span>`).join("")}</div>
    </div></div>`;
}

function answers() {
  const q = G().question; if (!q) return [];
  const ok = new Set(activePlayers(players()).map((p) => p.id));
  return Object.entries(G().answers || {}).filter(([id, a]) => a && a.q === q.id && ok.has(id)).map(([, a]) => a.v).sort((a, b) => a - b);
}
function median(a) { if (!a.length) return 0; const m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2); }
function questionHtml() {
  const q = G().question;
  if (!q) return `<div class="empty">No question is open.</div>`;
  const a = answers();
  const showValues = q.state !== "open";
  return `<div class="qv"><h1>${esc(q.prompt || "")}</h1>
    ${showValues ? `<div class="cards four">
        <div class="cd"><div class="k">LOWEST</div><div class="v">${a.length ? money(a[0]) : "–"}</div></div>
        <div class="cd"><div class="k">MIDDLE ANSWER</div><div class="v">${a.length ? money(median(a)) : "–"}</div></div>
        <div class="cd"><div class="k">AVERAGE</div><div class="v">${a.length ? money(Math.round(a.reduce((s, v) => s + v, 0) / a.length)) : "–"}</div></div>
        <div class="cd"><div class="k">HIGHEST</div><div class="v">${a.length ? money(a[a.length - 1]) : "–"}</div></div>
      </div>
      ${B.split && sceneCount() ? `<p class="split">Split evenly: ${money(CONFIG.scene.stake)} ÷ ${sceneCount()} people = <b>${money(Math.round(evenSplit()))}</b> each.</p>` : ""}
      <div class="chips">${a.map((v) => `<span class="chip">${money(v)}</span>`).join("")}</div>`
      : `<div class="empty">${a.length} answer${a.length === 1 ? "" : "s"} so far. Answers appear when the question closes.</div>`}
  </div>`;
}

function markHtml(row) {
  // One square per decision, in play order. Filled = bought, hollow = skipped.
  let h = "";
  CONFIG.decades.forEach((dec, d) => {
    const r = row.decades[d];
    h += `<span class="grp">`;
    dec.offers.forEach((o) => {
      let c = "none";
      if (r) {
        if (r.status === "skipped") c = "quiet";
        else if (r.noAnswer && r.noAnswer.includes(o.id)) c = "b auto";
        else c = r.picks[o.id] === true ? "b" : "s";
        if (r.events.some((e) => e.id === o.event.id && e.big)) c += " hit";
      }
      h += `<span class="mk ${c}"></span>`;
    });
    h += `</span>`;
  });
  return h;
}

// The big disaster that hit this row, if any: { short, bought }.
function bigHit(row) {
  for (const dr of row.decades) { const e = dr.events.find((x) => x.big); if (e) return e; }
  return null;
}
function tagFor(row) {
  const all = [];
  row.decades.forEach((dr) => dr.events.filter((x) => x.big).forEach((e) => all.push(`${e.short}, ${e.bought ? "insured" : "no insurance"}`)));
  return all.join("; ");
}
const npc = (r) => (r.house ? ` <span class="npc">– NPC</span>` : "");

// tails = true shows only the top and bottom rows, large, with one line for everyone in between.
function boardHtml(tails) {
  const m = meta();
  const closed = closedCount(m);
  const board = leaderboard(players(), state(), closed);
  const tot = classTotals(board);
  const vals = board.map((r) => r.savings);
  const lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
  const span = hi - lo;
  const zero = (-lo / span) * 100;
  // Column heading for the squares: one label per decade, sitting over that decade's squares.
  // Once a decade has closed, its heading also names the disaster that was dealt in it.
  const groups = CONFIG.decades.map((dec, d) => {
    const big = dec.offers.find((o) => o.event.big);
    const dealt = d < closed && !(state().results[d] || {}).skipped;
    return `<span class="grp h"><b>${dec.key}</b><small>${dealt && big ? esc(big.event.short) : "&nbsp;"}</small></span>`;
  }).join("");
  const rc = tails ? "row tl" : "row";
  const head = `<div class="${rc} head"><div></div><div>Name</div><div class="marks">${groups}</div>${tails ? `<div>What happened</div>` : `<div></div>`}<div class="num">Total savings</div><div class="num">Paid in</div><div class="num">Got back</div></div>`;
  const one = (r, i) => {
    const w = (Math.abs(r.savings) / span) * 100;
    const left = r.savings < 0 ? zero - w : zero;
    return `<div class="${rc}${r.house ? " house" : ""}">
      <div class="rank">${i + 1}</div>
      <div class="name">${B.host && B.manage && !r.house ? `<button class="x" data-act="remove" data-id="${r.id}" title="Remove">✕</button>` : ""}${esc(r.name)}${npc(r)}</div>
      <div class="marks">${markHtml(r)}</div>
      ${tails ? `<div class="tag">${esc(tagFor(r))}</div>` : `<div class="bar"><div class="fill${r.savings < 0 ? " neg" : ""}" style="left:${left}%;width:${w}%"></div><div class="zero" style="left:${zero}%"></div></div>`}
      <div class="num sav${r.savings < 0 ? " neg" : ""}">${money(r.savings)}</div>
      <div class="num sm">${money(r.paidIn)}</div>
      <div class="num sm">${money(r.gotBack)}</div>
    </div>`;
  };
  const KEEP = 6;
  let rows;
  if (tails && board.length > KEEP * 2 + 1) {
    const mid = board.slice(KEEP, board.length - KEEP);
    rows = board.slice(0, KEEP).map(one).join("")
      + `<div class="${rc} mid"><div></div><div class="between">${mid.length} others, between ${money(mid[mid.length - 1].savings)} and ${money(mid[0].savings)}</div></div>`
      + board.slice(board.length - KEEP).map((r, i) => one(r, board.length - KEEP + i)).join("");
  } else rows = board.map(one).join("");
  const keptText = tot.kept >= 0 ? `the insurance company kept <b>${money(tot.kept)}</b>` : `the insurance company paid out <b>${money(-tot.kept)}</b> more than it took in`;
  return `<div class="lb"><div class="rows" id="rows">${head}${rows}</div>
    <div class="foot"><span>Class total: paid in <b>${money(tot.paidIn)}</b>, got back <b>${money(tot.gotBack)}</b>, so ${keptText}.</span>
    <span class="legend"><span class="mk b"></span>bought <span class="mk s"></span>skipped <span class="mk s hit"></span>&nbsp;disaster <span class="mk b auto"></span>no choice (counts as bought)</span></div></div>`;
}
function sizeRows() {
  const box = $("rows"); if (!box) return;
  const n = box.children.length;
  const rh = Math.max(16, Math.min(68, Math.floor(box.clientHeight / (n + 0.5)))); // the heading row is one and a half rows tall
  // Text size follows the row height, but never so large that the columns stop fitting across the screen.
  const emsAcross = B.view === "tails" ? 59 : 50;
  const fs = Math.min(rh * 0.68, box.clientWidth / emsAcross);
  document.documentElement.style.setProperty("--rh", rh + "px");
  document.documentElement.style.setProperty("--fs", fs.toFixed(1) + "px");
}

function summaryHtml() {
  const m = meta();
  const closed = closedCount(m);
  if (!closed) return `<div class="empty">The summary appears after the first decade closes.</div>`;
  if (m.phase === "final") return wholeGameHtml();
  const d = Math.min(closed - 1, N_DECADES - 1);
  const dec = CONFIG.decades[d];
  const res = state().results[d] || {};
  const board = leaderboard(players(), state(), closed);
  const real = board.filter((r) => !r.house);
  const tot = classTotals(board);
  if (res.skipped) return `<div class="sum"><h1>The ${dec.key} passed quietly</h1><p>Nobody chose anything this decade, and everyone saved.</p></div>`;
  let h = `<div class="sum"><h1>The ${dec.key}</h1>`;
  dec.offers.forEach((o) => {
    const ans = present(d).map((p) => picksFor(p, d, state().choices, state().results)[o.id]);
    const bought = ans.filter((v) => v === true).length, skipped = ans.filter((v) => v === false).length, silent = ans.length - bought - skipped;
    h += `<section><p><b>${esc(o.name)}:</b> ${bought} bought, ${skipped} skipped${silent ? `, ${silent} didn't choose` : ""}.</p>`;
    if (!o.event.big) {
      const n = real.filter((r) => r.decades[d] && r.decades[d].events.some((e) => e.id === o.event.id)).length;
      if (o.event.tally) h += `<p>${n} ${esc(o.event.tally)}. With protection it cost ${money(o.event.boughtCost)}. Without it, ${money(o.event.skipCost)}.</p>`;
      h += `</section>`;
      return;
    }
    const hitRows = board.filter((r) => r.decades[d] && r.decades[d].events.some((e) => e.id === o.event.id));
    const card = (r) => {
      if (!r) return "";
      const e = r.decades[d].events.find((x) => x.id === o.event.id);
      const note = (t) => (e.bought && t ? ` <span class="nt">(${esc(t)})</span>` : "");
      return `<div class="cd"><div class="k2">${e.bought ? "Bought" : "Skipped"} ${esc(o.noun)} and ${esc(o.event.had)}</div><p class="who">${esc(r.name)}${npc(r)}</p>
        <table class="rc">
          <tr><td>${esc(e.bill)}</td><td>${money(e.fullCost)}</td></tr>
          <tr><td>The policy paid${note(e.paidNote)}</td><td>${money(e.insurerPaid)}</td></tr>
          <tr class="t"><td>From their own savings${note(e.ownNote)}</td><td>${money(e.cost)}</td></tr>
        </table>
        <p class="sm">Premiums they paid for it in their ${dec.key}: ${money(e.bought ? o.premium * CONFIG.years : 0)}</p>
        <p>Total savings at ${dec.endAge}: <b class="${r.decades[d].end < 0 ? "neg" : ""}">${money(r.decades[d].end)}</b></p></div>`;
    };
    h += `<p>${esc(o.event.happened)}: one who bought ${esc(o.noun)} and one who skipped it.</p><div class="cards">${card(hitRows.find((r) => r.decades[d].events.find((x) => x.id === o.event.id).bought))}${card(hitRows.find((r) => !r.decades[d].events.find((x) => x.id === o.event.id).bought))}</div></section>`;
  });
  const top = real[0], bottom = real[real.length - 1];
  h += `<section><div class="lab">Insurance summary: the whole class so far</div><div class="cards three">
      <div class="cd"><div class="k">CLASS PAID IN</div><div class="v">${money(tot.paidIn)}</div></div>
      <div class="cd"><div class="k">CLASS GOT BACK</div><div class="v">${money(tot.gotBack)}</div></div>
      <div class="cd"><div class="k">${tot.kept >= 0 ? "INSURANCE COMPANY KEPT" : "COMPANY PAID OUT MORE BY"}</div><div class="v">${money(Math.abs(tot.kept))}</div></div>
    </div></section>`;
  if (top) h += `<section><div class="lab">Class score summary</div><p>Highest total savings: <b>${esc(top.name)}</b>, ${money(top.savings)}. Lowest: <b>${esc(bottom.name)}</b>, <span class="${bottom.savings < 0 ? "neg" : ""}">${money(bottom.savings)}</span>.</p></section>`;
  return h + `</div>`;
}

// One dot per player along a line of total savings. A dot sits at its exact amount and
// stacks upward when it would overlap another. Dark red = below zero, grey = NPC,
// gold ring = hit by a big disaster. Players below zero are named.
function drawSpread() {
  const m = meta(); const closed = closedCount(m);
  const box = $("plot"); if (!box) return;
  if (!closed) { $("sph").textContent = "Total savings"; box.innerHTML = `<div class="empty">The picture appears after the first decade closes.</div>`; return; }
  const age = CONFIG.decades[Math.min(closed, N_DECADES) - 1].endAge;
  $("sph").textContent = `Total savings at ${age}`;
  const board = leaderboard(players(), state(), closed);
  const W = Math.max(600, box.clientWidth), H = Math.max(300, box.clientHeight);
  const f = Math.max(15, Math.min(30, W / 62));            // text size
  let r = Math.max(8, Math.min(22, W / 80, H / 26));       // dot radius (made smaller below if a stack gets too tall)
  const L = f * 3.2, R = f * 3.2, axisY = H - f * 3.2;
  const vals = board.map((x) => x.savings);
  let lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
  if (B.goal) hi = Math.max(hi, CONFIG.goal);
  const step = [25000, 50000, 100000, 200000, 250000, 500000].find((st) => (hi - lo) / st <= 9) || 1000000;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = (v) => L + ((v - lo) / (hi - lo)) * (W - L - R);
  // place the dots; if the tallest stack would run off the top, shrink the dots and try again
  let placed = [];
  for (let attempt = 0; attempt < 12; attempt++) {
    placed = [];
    [...board].sort((a, b) => a.savings - b.savings).forEach((p) => {
      const cx = x(p.savings); let level = 0;
      while (placed.some((q) => q.level === level && Math.abs(q.cx - cx) < r * 2 + 3)) level++;
      placed.push({ p, cx, level, cy: axisY - r - 8 - level * (r * 2 + 3) });
    });
    if (Math.min(...placed.map((q) => q.cy)) - r >= f * 3 || r <= 4) break;
    r *= 0.85;
  }
  let g = "";
  // axis and its labels
  for (let v = lo; v <= hi + 1; v += step) {
    g += `<line x1="${x(v)}" y1="${axisY}" x2="${x(v)}" y2="${axisY + f * 0.35}" stroke="#8A9AB5" stroke-width="2"/>`;
    g += `<text x="${x(v)}" y="${axisY + f * 1.45}" text-anchor="middle" font-size="${f * 0.9}" ${v < 0 ? `style="fill:#8C2F2F"` : ""}>${money(v)}</text>`;
  }
  g += `<line x1="${L - r}" y1="${axisY}" x2="${W - R + r}" y2="${axisY}" stroke="#8A9AB5" stroke-width="2"/>`;
  if (lo < 0) g += `<line x1="${x(0)}" y1="${f * 1.2}" x2="${x(0)}" y2="${axisY}" stroke="#1B2A49" stroke-width="3"/>`;
  if (B.goal) {
    const real = board.filter((p) => !p.house); const made = real.filter((p) => p.savings >= CONFIG.goal).length;
    g += `<line x1="${x(CONFIG.goal)}" y1="${f * 1.2}" x2="${x(CONFIG.goal)}" y2="${axisY}" stroke="#C8972B" stroke-width="4" stroke-dasharray="${f * 0.5} ${f * 0.35}"/>`;
    g += `<text x="${x(CONFIG.goal) - f * 0.4}" y="${f * 1.1}" text-anchor="end" font-size="${f}" font-weight="700" stroke="#fff" stroke-width="${f * 0.4}" stroke-linejoin="round" paint-order="stroke">Goal: ${money(CONFIG.goal)}</text>`;
    g += `<text x="${x(CONFIG.goal) - f * 0.4}" y="${f * 2.3}" text-anchor="end" font-size="${f * 0.9}">${made} of ${real.length} reached it</text>`;
  }
  // the dots
  placed.forEach((q) => {
    const fill = q.p.savings < 0 ? "#8C2F2F" : q.p.house ? "#9AA8C0" : "#4A6FA5";
    if (bigHit(q.p)) g += `<circle cx="${q.cx}" cy="${q.cy}" r="${r + 1}" fill="none" stroke="#C8972B" stroke-width="${Math.max(3, r * 0.32)}"/>`;
    g += `<circle cx="${q.cx}" cy="${q.cy}" r="${r - Math.max(3, r * 0.32) / 2 - 1}" fill="${fill}"/>`;
  });
  // name everyone below zero, each on its own line above the dots so the labels can't collide
  const under = placed.filter((q) => q.p.savings < 0).sort((a, b) => b.cx - a.cx); // right to left
  const ruler = document.createElement("canvas").getContext("2d");
  ruler.font = `700 ${f}px Calibri, "Segoe UI", Helvetica, Arial, sans-serif`;
  const labels = [];
  under.forEach((q) => {
    const tag = tagFor(q.p);
    const x0 = q.cx - f * 0.2;
    const x1 = x0 + ruler.measureText(`${q.p.name} ${money(q.p.savings)}  ${tag}`).width + f * 0.5;
    const inPath = placed.filter((o) => o !== q && o.cx + r > x0 && o.cx - r < x1);
    let ly = Math.min(q.cy - r - f * 0.9, ...inPath.map((o) => o.cy - r - f * 0.7));
    for (let moved = true; moved; ) {
      moved = false;
      for (const b of labels) {
        const touches = x0 < b.x1 && x1 > b.x0 && Math.abs(ly - b.ly) < f * 1.4;
        const crossesLeader = b.cx > x0 && b.cx < x1 && ly > b.ly;
        if (touches || crossesLeader) { ly = b.ly - f * 1.5; moved = true; }
      }
    }
    ly = Math.max(f * 1.6, ly);
    labels.push({ x0, x1, ly, cx: q.cx });
    g += `<line x1="${q.cx}" y1="${q.cy - r - 3}" x2="${q.cx}" y2="${ly + f * 0.3}" stroke="#8C2F2F" stroke-width="1.5"/>`;
    g += `<text x="${x0}" y="${ly}" font-size="${f}" stroke="#fff" stroke-width="${f * 0.4}" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="700">${esc(q.p.name)}</tspan><tspan style="fill:#8C2F2F" font-weight="700"> ${money(q.p.savings)}</tspan>${tag ? `<tspan style="fill:#5B6475">  ${esc(tag)}</tspan>` : ""}</text>`;
  });
  // legend
  const ly = H - f * 0.5; const dot = (cx, fill, ring) => `${ring ? `<circle cx="${cx}" cy="${ly - f * 0.33}" r="${f * 0.42}" fill="none" stroke="#C8972B" stroke-width="3"/>` : ""}<circle cx="${cx}" cy="${ly - f * 0.33}" r="${f * 0.3}" fill="${fill}"/>`;
  const items = [["#4A6FA5", false, "one player"], ["#8C2F2F", false, "below zero"], ["#9AA8C0", false, "NPC"], ["#4A6FA5", true, "hit by a disaster"]];
  let lx = L;
  items.forEach(([fill, ring, label]) => { g += dot(lx, fill, ring) + `<text x="${lx + f * 0.75}" y="${ly}" font-size="${f * 0.85}" style="fill:#5B6475">${label}</text>`; lx += f * (2.2 + label.length * 0.47); });
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Each player's total savings as a dot on a line">${g}</svg>`;
}

// After "Show the ending", the Summary view covers the whole game: for each decade's disaster,
// where the person who bought the insurance and the person who skipped it finished at 60.
function wholeGameHtml() {
  const board = leaderboard(players(), state(), N_DECADES);
  const real = board.filter((r) => !r.house);
  const tot = classTotals(board);
  const cell = (r) => (r ? `<td>${esc(r.name)}${npc(r)}</td><td class="n${r.savings < 0 ? " neg" : ""}">${money(r.savings)}</td>` : `<td>–</td><td></td>`);
  let rows = "";
  CONFIG.decades.forEach((dec, d) => {
    const o = dec.offers.find((x) => x.event.big);
    if (!o) return;
    if ((state().results[d] || {}).skipped) { rows += `<tr><td><b>${dec.key}</b></td><td colspan="5">Passed quietly</td></tr>`; return; }
    const ev = (r) => r.decades[d] && r.decades[d].events.find((e) => e.id === o.event.id);
    const hit = board.filter((r) => ev(r));
    rows += `<tr><td><b>${dec.key}</b></td><td>${esc(o.event.short)}</td>${cell(hit.find((r) => ev(r).bought))}${cell(hit.find((r) => !ev(r).bought))}</tr>`;
  });
  const under = real.filter((r) => r.savings < 0).length;
  const top = real[0], bottom = real[real.length - 1];
  let h = `<div class="sum"><h1>The whole game</h1>
    <section><p>Each decade, the disaster hit two people: one who bought the insurance and one who skipped it. This is where each of them ended at 60.</p>
      <table class="wg"><tr><th>Decade</th><th>What happened</th><th colspan="2">Bought the insurance: total savings at 60</th><th colspan="2">Skipped it: total savings at 60</th></tr>${rows}</table></section>
    <section><div class="lab">Insurance summary: the whole class, all four decades</div><div class="cards three">
      <div class="cd"><div class="k">CLASS PAID IN</div><div class="v">${money(tot.paidIn)}</div></div>
      <div class="cd"><div class="k">CLASS GOT BACK</div><div class="v">${money(tot.gotBack)}</div></div>
      <div class="cd"><div class="k">${tot.kept >= 0 ? "INSURANCE COMPANY KEPT" : "COMPANY PAID OUT MORE BY"}</div><div class="v">${money(Math.abs(tot.kept))}</div></div>
    </div></section>`;
  if (top) h += `<section><div class="lab">Class score summary</div><p>Highest total savings: <b>${esc(top.name)}</b>, ${money(top.savings)}. Lowest: <b>${esc(bottom.name)}</b>, <span class="${bottom.savings < 0 ? "neg" : ""}">${money(bottom.savings)}</span>. ${under} of ${real.length} ended below zero.</p></section>`;
  return h + `</div>`;
}

function drawControls() {
  const c = $("controls");
  if (!B.host) { c.className = "viewer"; return; }
  c.className = "";
  const m = meta();
  const q = G().question;
  let main = "";
  if (!B.gameId || !m) main = `<button class="go" data-act="newGame">New game</button>`;
  else if (m.phase === "lobby") {
    const sc = scene();
    if (!sc) main = `<button class="go" data-act="setup">Opening scene: show the setup</button><button data-act="open" data-d="0" data-confirm="Skip the opening scene and open the ${CONFIG.decades[0].key}?">Skip the scene: open the ${CONFIG.decades[0].key}</button>`;
    else if (q && q.state === "open") main = `<button class="go" data-act="qclose">Close question, show answers</button>`;
    else if (!sc.round) main = `<button class="go" data-act="draw1">Draw round 1</button>`;
    else if (sc.round === 1 && sc.state === "revealed") main = `<button class="go" data-act="offer">Show the proposal</button><button data-act="showname" class="${B.showName ? "on" : ""}">Show the name</button><button data-act="draw1">Draw again</button>`;
    else if (sc.round === 1 && sc.state === "offer") main = `<button class="go" data-act="qopen">Open question</button>`;
    else if (sc.round === 1) {
      // One click starts round 2. Each button shows its price; one that would lose money is outlined in red and says so.
      const pm = priceMath(currentPrice());
      const mid = middlePrice(), fair = marginPrice();
      const midKept = mid === null ? 0 : priceMath(mid).kept;
      const midBtn = mid === null ? "" : `<button class="${midKept < 0 ? "warn" : "go"}" data-act="draw2mid">Round 2 at the middle answer: ${money(mid)}${midKept < 0 ? ` (short ${money(-midKept)})` : ""}</button>`;
      main = `${midBtn}<button class="go" data-act="draw2fair">Round 2 at the even split + ${Math.round(CONFIG.scene.margin * 100)}%: ${money(fair)}</button>
        <label>or type a price: <input id="price" inputmode="numeric" style="min-width:100px;width:100px" value="${money(currentPrice())}"></label>
        <button data-act="draw2">Draw at that price</button>
        <span id="pricemath" class="math${pm.kept < 0 ? " neg" : ""}" style="${pm.kept < 0 ? "color:var(--debt)" : ""}">${pm.text}</span>
        <button data-act="split" class="${B.split ? "on" : ""}">Show the even split</button><button data-act="qopen">Ask again</button>`;
    } else if (sc.state === "revealed") main = `<button class="go" data-act="outcome">Show the outcome</button><button data-act="showname" class="${B.showName ? "on" : ""}">Show the name</button><button data-act="draw2again">Draw round 2 again</button>`;
    else if (sc.state === "outcome") main = `<button class="go" data-act="takeaway">Show the takeaway</button><button data-act="phones2">Back to the phones</button>`;
    else main = `<button class="go" data-act="open" data-d="0">Open the ${CONFIG.decades[0].key}</button><button data-act="outcome">Back to the outcome</button>`;
  }
  else if (m.phase === "open") main = `<button class="go" data-act="close">Close the ${CONFIG.decades[m.decade].key}</button>`;
  else if (m.phase === "closed") {
    const next = m.decade + 1;
    main = next < N_DECADES
      ? `<button class="go" data-act="open" data-d="${next}">Open the ${CONFIG.decades[next].key}</button><button data-act="skip" data-d="${next}">Skip the ${CONFIG.decades[next].key}</button>`
      : `<button class="go" data-act="final">Show the ending</button>`;
  } else main = `<span>Game over.</span>`;
  const pre = !!m && m.phase === "lobby";
  const views = !m ? "" : (pre ? ["lobby", ...(scene() ? ["scene"] : []), "question"] : ["lobby", "board", "summary", "tails", "spread"]).map((v) => `<button data-act="view" data-v="${v}" class="${B.view === v ? "on" : ""}">${{ lobby: "Join screen", scene: "Opening scene", board: "Leaderboard", tails: "Top and bottom", spread: "Distribution", summary: "Summary", question: "Question" }[v]}</button>`).join("")
    + (m && B.view === "spread" ? `<button data-act="goal" class="${B.goal ? "on" : ""}">Goal line</button>` : "");
  // The question belongs to the opening scene, where the gold button runs it. The game has no question buttons.
  const more = !m ? "" : `<div id="more" class="${B.more ? "on" : ""}">
      ${m.phase === "lobby" ? `<label>Question: <input id="prompt" value="${esc(B.prompt)}"></label>` : ""}
      <button data-act="manage" class="${B.manage ? "on" : ""}">Remove a player…</button>
      ${m.phase === "lobby" ? `<button data-act="test">Add 10 test players</button>` : ""}
      ${m.phase === "lobby" && scene() && scene().state !== "takeaway" ? `<button data-act="open" data-d="0" data-confirm="Leave the opening scene now and open the ${CONFIG.decades[0].key}?">Leave the scene: open the ${CONFIG.decades[0].key}</button>` : ""}
      ${m.phase === "closed" ? `<button data-act="reopen">Reopen the ${CONFIG.decades[m.decade].key} (deal again)</button>` : ""}
      ${m.phase === "final" ? `<button data-act="unfinal">Back to the last decade</button>` : ""}
      <button class="warn" data-act="wipe">Delete this game's data</button>
      <button data-act="newGame">New game</button>
    </div>`;
  const focusPrompt = document.activeElement && (document.activeElement.id === "prompt" || document.activeElement.id === "price");
  if (focusPrompt) return; // don't redraw while Chris is typing the question
  c.className = pre ? "pre" : "";
  const stage = !m ? "" : `<span class="stage">${pre ? "Before the game: opening scene" : "The game"}</span>`;
  c.innerHTML = `${stage}${main}<span class="sep"></span>${views}${m ? `<span class="sep"></span><button data-act="more" class="${B.more ? "on" : ""}">More</button>` : ""}${more}`;
}

// A double-click must not run two steps. The gold button changes meaning the moment it is
// pressed (Open becomes Close), so a second game-changing click within 1.5 seconds is ignored.
// The question buttons are a separate group, so "close the question, then open the 20s" still works.
const GROUPS = { newGame: "game", open: "game", close: "game", skip: "game", final: "game", unfinal: "game", reopen: "game", wipe: "game", test: "game", setup: "game", draw1: "game", draw2: "game", draw2mid: "game", draw2fair: "game", draw2again: "game", offer: "game", outcome: "game", takeaway: "game", phones2: "game", qopen: "question", qclose: "question", qhide: "question" };
const lastStep = {};
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b || !B.host) return;
  const a = b.dataset.act;
  if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
  if (GROUPS[a]) {
    if (B.offline) return; // see the offline bar
    if (Date.now() - (lastStep[GROUPS[a]] || 0) < 1500) return;
    lastStep[GROUPS[a]] = Date.now();
  }
  if (a === "newGame") { if (!meta() || confirm("Start a new game? Players will need to join again.")) act.newGame(); }
  else if (a === "open") act.openDecade(Number(b.dataset.d));
  else if (a === "close") act.closeDecade();
  else if (a === "skip") act.skipDecade(Number(b.dataset.d));
  else if (a === "final") act.showFinal();
  else if (a === "unfinal") act.backFromFinal();
  else if (a === "reopen") act.reopenDecade();
  else if (a === "view") { B.view = b.dataset.v; render(); }
  else if (a === "qopen") act.openQuestion();
  else if (a === "qclose") act.closeQuestion();
  else if (a === "qhide") act.hideQuestion();
  else if (a === "more") { B.more = !B.more; render(); }
  else if (a === "goal") { B.goal = !B.goal; render(); }
  else if (a === "setup") act.sceneSetup();
  else if (a === "offer" || a === "outcome" || a === "takeaway") act.sceneStep(a);
  else if (a === "phones2") act.sceneStep("revealed");
  else if (a === "draw1") act.drawScene(1);
  else if (a === "draw2") act.drawScene(2, currentPrice());
  else if (a === "draw2mid") act.drawScene(2, middlePrice());
  else if (a === "draw2fair") act.drawScene(2, marginPrice());
  else if (a === "draw2again") act.drawScene(2, Number(scene().price) || 0);
  else if (a === "showname") { B.showName = !B.showName; B.view = "scene"; render(); }
  else if (a === "split") { B.split = !B.split; B.view = "question"; render(); }

  else if (a === "manage") { B.manage = !B.manage; render(); }
  else if (a === "test") act.addTest(10);
  else if (a === "remove") { const p = players()[b.dataset.id]; if (confirm("Remove " + (p ? p.name : "this player") + " from the game?")) act.remove(b.dataset.id); }
  else if (a === "wipe") { if (confirm("Delete all data for this game? This can't be undone.")) act.wipe(); }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "prompt") B.prompt = ev.target.value;
  if (ev.target.id === "price") {
    // Chris types a price for round 2; the line beside it shows at once whether the organizer comes out ahead.
    const digits = ev.target.value.replace(/[^0-9]/g, "").slice(0, 7);
    B.price = digits ? Number(digits) : 0;
    const pm = priceMath(B.price); const el = $("pricemath");
    if (el) { el.textContent = pm.text; el.className = "math" + (pm.kept < 0 ? " neg" : ""); el.style.color = pm.kept < 0 ? "var(--debt)" : ""; }
  }
});
document.addEventListener("focusout", (ev) => { if (ev.target.id === "prompt" || ev.target.id === "price") setTimeout(render, 0); });
</script>
</body>
</html>
