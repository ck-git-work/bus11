<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BUS 11 Insurance Game</title>
<style>
  :root {
    --navy: #1B2A49; --gold: #C8972B; --muted: #5B6475; --bg: #F5F7FA; --card: #FFFFFF;
    --border: #8A9AB5; --tint: #F6EFD9; --slate: #4A6FA5; --debt: #8C2F2F;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--navy); font: 18px/1.45 Calibri, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { background: var(--navy); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  header .t { font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: .02em; }
  header .who { font-size: 16px; color: #E4B94A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50vw; }
  #offline { display: none; background: var(--gold); color: #1B2A49; text-align: center; font-size: 15px; padding: 6px 10px; }
  #offline.on { display: block; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font: 700 28px/1.15 Arial, Helvetica, sans-serif; margin: 6px 0 8px; }
  h2 { font: 700 19px Arial, Helvetica, sans-serif; margin: 0 0 4px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid #DCE2EB; border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .nums { width: 100%; border-collapse: collapse; }
  .nums td { padding: 5px 0; vertical-align: baseline; }
  .nums td:last-child { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .nums tr.total td { border-top: 1px solid #B9C3D3; padding-top: 9px; font-weight: 700; font-size: 20px; }
  .nums .sub td { padding-top: 0; font-size: 15px; color: var(--muted); font-weight: 400; text-align: left; white-space: normal; }
  .neg { color: var(--debt); }
  .paid { font-size: 16px; color: var(--muted); margin: 10px 2px; }
  .pre { margin: 16px 2px; }
  .offer .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .offer .price { font: 700 19px Arial, sans-serif; white-space: nowrap; }
  .offer .price small { font: 400 15px Calibri, sans-serif; color: var(--muted); }
  .offer p { margin: 6px 0 0; font-size: 17px; color: var(--muted); }
  .seg { display: flex; gap: 10px; margin-top: 12px; }
  .seg button { flex: 1; }
  button { font: 700 19px Arial, Helvetica, sans-serif; min-height: 54px; border-radius: 10px; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); padding: 10px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button.on { background: var(--navy); color: #fff; }
  button.primary { width: 100%; background: var(--gold); border-color: var(--gold); color: #1B2A49; margin-top: 6px; }
  button.primary:disabled { background: #D9DEE7; border-color: #D9DEE7; color: #7B8598; cursor: default; }
  button.plain { width: 100%; border-width: 1px; font-weight: 400; font-size: 17px; min-height: 46px; margin-top: 10px; }
  .save { background: var(--tint); border-radius: 12px; padding: 12px 16px 14px; margin: 16px 0 10px; text-align: center; }
  .save span { display: block; font-size: 17px; }
  .save b { display: block; font: 700 28px/1.15 Arial, Helvetica, sans-serif; white-space: nowrap; font-variant-numeric: tabular-nums; }
  input[type=text] { width: 100%; font: 22px Calibri, "Segoe UI", sans-serif; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px; color: var(--navy); margin: 8px 0 10px; }
  .big { font: 700 44px/1.05 Arial, Helvetica, sans-serif; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .msg { color: var(--debt); min-height: 1.4em; }
  .watch { text-align: center; color: var(--muted); margin-top: 18px; }
  /* the opening scene: the whole phone turns one color */
  .fill { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 28px; color: #fff; }
  .fill.good { background: #1E7A46; }
  .fill.bad { background: #B3261E; }
  .fill .bigword { font: 700 60px/1.05 Arial, Helvetica, sans-serif; margin-bottom: 14px; }
  .fill p { font-size: 23px; margin: 8px 0; }
  .fill .hold { font-size: 18px; opacity: 0.85; margin-top: 30px; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 16px; }
  table.hist th { text-align: left; font: 700 14px Arial, sans-serif; color: var(--muted); padding: 4px 6px 4px 0; border-bottom: 2px solid var(--navy); }
  table.hist td { padding: 7px 6px 7px 0; border-bottom: 1px solid #D5DBE5; vertical-align: top; }
  table.hist td:last-child, table.hist th:last-child { text-align: right; white-space: nowrap; padding-right: 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header><span class="t">BUS 11 · Insurance</span><span class="who" id="who"></span></header>
<div id="offline">Reconnecting…</div>
<main id="app"><p class="muted">Connecting…</p></main>

<script type="module">
import { CONFIG, N_DECADES, money, signed, canSave, yearlySaved, scorePlayer, dealSolo, joinDecadeFor, closedCount } from "./game.js";
import { connect, randomId, sha256 } from "./net.js";

const SOLO_HASH = "8df6181396a8bf3398b775734cbefc754e7aca2c8d019238ffa88db9356c4e5f";
const UNLUCKY_HASH = "62d779f81f73e5c7402e32c7bab049bac69c7a440a623f493b3547ca697ac8d4"; // the instructor's demo link
const params = new URLSearchParams(location.search);
const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Everything the page knows. The screen is always redrawn from this.
const S = { solo: false, unlucky: false, ready: false, gameId: null, pid: null, meta: null, results: null, question: null, scene: null, me: null, mine: null, answer: null, joinMsg: "", clash: null, editAnswer: false };
let net = null;
let stops = [];      // listeners on the game
let mineStops = [];  // listeners on this player's own records

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const pidKey = (g) => `bus11ins:${g}:pid`;

// ---------- starting up ----------
start();
async function start() {
  const soloKey = params.get("solo");
  if (soloKey) {
    const h = await sha256(soloKey);
    if (h === SOLO_HASH) return startSolo(false);
    if (h === UNLUCKY_HASH) return startSolo(true);
  }
  try {
    net = await connect();
  } catch (e) {
    app.innerHTML = `<h1>Can't connect</h1><p>This phone couldn't reach the game. Check your connection and reload the page. If it keeps happening, tell Chris.</p>`;
    return;
  }
  let wasOffline = null;
  net.onConnection((ok) => {
    clearTimeout(wasOffline);
    if (ok) document.getElementById("offline").classList.remove("on");
    else wasOffline = setTimeout(() => document.getElementById("offline").classList.add("on"), 2500);
  });
  const fixed = params.get("g");
  if (fixed) useGame(fixed);
  else net.on("current", (g) => useGame(g || null));
}

function useGame(g) {
  if (g === S.gameId && S.ready) return;
  stops.forEach((f) => f()); stops = [];
  mineStops.forEach((f) => f()); mineStops = [];
  Object.assign(S, { ready: true, gameId: g, pid: null, meta: null, results: null, question: null, scene: null, me: null, mine: null, answer: null, joinMsg: "", clash: null });
  if (!g) return render();
  stops.push(net.on(`games/${g}/meta`, (v) => { S.meta = v; render(); }));
  stops.push(net.on(`games/${g}/results`, (v) => { S.results = v; render(); }));
  stops.push(net.on(`games/${g}/question`, (v) => { S.question = v; render(); }));
  stops.push(net.on(`games/${g}/scene`, (v) => { S.scene = v; render(); }));
  const saved = store.get(pidKey(g));
  if (saved) listenMine(saved);
  render();
}

function listenMine(pid) {
  mineStops.forEach((f) => f()); mineStops = [];
  S.pid = pid;
  const g = S.gameId;
  mineStops.push(net.on(`games/${g}/players/${pid}`, (v) => { S.me = v; render(); }));
  mineStops.push(net.on(`games/${g}/choices/${pid}`, (v) => { S.mine = v; render(); }));
  mineStops.push(net.on(`games/${g}/answers/${pid}`, (v) => { S.answer = v; render(); }));
}

// ---------- things the player can do ----------
let joining = false;
async function join(rawName) {
  if (joining) return; // a second tap while the first is still on its way does nothing
  const name = rawName.replace(/\s+/g, " ").trim().slice(0, 16);
  if (!name) { S.joinMsg = "Type a name first."; return render(); }
  joining = true;
  const btn = app.querySelector('[data-act="join"]');
  if (btn) { btn.disabled = true; btn.textContent = "Joining…"; }
  try {
    const players = (await net.get(`games/${S.gameId}/players`)) || {};
    const clash = Object.entries(players).find(([, p]) => p && !p.removed && (p.name || "").toLowerCase() === name.toLowerCase());
    if (clash) { S.clash = { id: clash[0], name: clash[1].name }; S.joinMsg = ""; return render(); }
    const pid = randomId();
    store.set(pidKey(S.gameId), pid);
    // Start listening first, so the screen moves on as soon as the write is made locally.
    net.set(`games/${S.gameId}/players/${pid}`, { name, joinedAt: Date.now(), joinedDecade: joinDecadeFor(S.meta) });
    listenMine(pid);
  } catch (e) {
    S.joinMsg = "That didn't go through. Try again.";
    lastKey = ""; render();
  } finally {
    joining = false;
  }
}
function resume(pid) {
  store.set(pidKey(S.gameId), pid);
  S.clash = null;
  listenMine(pid);
}
function setPick(d, offerId, value) {
  if (S.solo) { soloPick(d, offerId, value); return; }
  net.update(`games/${S.gameId}/choices/${S.pid}/${d}/picks`, { [offerId]: value });
}
function setLocked(d, value) {
  if (S.solo) { soloLock(d); return; }
  net.update(`games/${S.gameId}/choices/${S.pid}/${d}`, { locked: value });
}
function sendAnswer(n) {
  S.editAnswer = false;
  net.set(`games/${S.gameId}/answers/${S.pid}`, { v: n, q: S.question.id || 1, at: Date.now() });
}

// ---------- solo mode (the fallback: one phone, no scoreboard) ----------
function startSolo(unlucky) {
  Object.assign(S, { solo: true, unlucky, ready: true, gameId: "solo", pid: "solo", me: { name: "You", joinedDecade: 0 }, mine: {}, results: {}, meta: { phase: "open", decade: 0 } });
  render();
}
function soloPick(d, offerId, value) {
  S.mine[d] = S.mine[d] || { picks: {} };
  S.mine[d].picks[offerId] = value;
  render();
}
function soloLock(d) {
  const hadBig = Object.entries(S.results).some(([k, r]) => CONFIG.decades[k].offers.some((o) => o.event.big && r.hits.solo && r.hits.solo[o.event.id]));
  S.results[d] = { hits: { solo: dealSolo(d, S.mine[d].picks, hadBig, Math.random, S.unlucky) } };
  S.meta = { phase: "closed", decade: d };
  render();
  window.scrollTo(0, 0);
}
function soloNext() {
  const d = S.meta.decade;
  S.meta = d + 1 < N_DECADES ? { phase: "open", decade: d + 1 } : { phase: "final", decade: d };
  render();
  window.scrollTo(0, 0);
}

// ---------- drawing the screen ----------
function me() { return { id: S.pid, name: S.me.name, joinedDecade: S.me.joinedDecade || 0 }; }
function myScore(closed) { return scorePlayer(me(), { choices: { [S.pid]: S.mine || {} }, results: S.results || {} }, closed); }
function cls(n) { return n < 0 ? ' class="neg"' : ""; }

let lastKey = "";
function render() {
  const [key, html] = view();
  document.getElementById("who").textContent = S.solo ? (S.unlucky ? "Instructor demo" : "") : S.me ? S.me.name : "";
  if (key === lastKey) return;
  lastKey = key;
  app.innerHTML = html;
}

function view() {
  if (!S.ready) return ["boot", `<p class="muted">Connecting…</p>`];
  if (!S.gameId || !S.meta) return ["nogame", `<h1>Almost ready</h1><p>The game hasn't started yet. Keep this page open.</p>`];
  if (!S.solo) {
    if (S.me && S.me.removed) return ["removed", `<h1>You were removed from the game</h1><p>Join again with a different name.</p><button class="primary" data-act="rejoin">Join again</button>`];
    if (!S.pid || !S.me) return joinView();
    const q = S.question;
    if (q && q.state === "open") return questionView(q);
  }
  const m = S.meta;
  if (m.phase === "lobby" && S.scene && S.scene.state === "revealed" && S.scene.pid) return sceneView(S.scene);
  if (m.phase === "lobby") return ["lobby|" + (S.answer ? S.answer.v : ""), `<h1>You're in, ${esc(S.me.name)}.</h1><p>Watch the screen. The game starts soon.</p>`];
  if (m.phase === "open") {
    if ((S.me.joinedDecade || 0) > m.decade) return ["late|" + m.decade, `<h1>You're in, ${esc(S.me.name)}.</h1><p>You'll start with the next decade. Watch the screen.</p>`];
    return decadeView(m.decade);
  }
  if (m.phase === "closed") return resultView(m.decade);
  return finalView();
}

// The opening scene. Red means the accident landed on you; green means it didn't.
// In round 2 everyone paid the price, so the one who is hit is covered.
function sceneView(sc) {
  const stake = CONFIG.scene.stake;
  const mine = sc.pid === S.pid;
  const price = sc.round === 2 ? Number(sc.price) || 0 : 0;
  let lines;
  if (sc.round === 2) {
    lines = mine
      ? [CONFIG.scene.disaster, `But you're covered. The pool pays the ${money(stake)}.`, `You paid ${money(price)}. You have ${money(stake - price)}.`]
      : [`You paid ${money(price)}.`, `You have ${money(stake - price)}.`];
  } else {
    lines = mine ? [CONFIG.scene.disaster, `You have ${money(0)}.`] : [`You still have ${money(stake)}.`];
  }
  return [`scene|${sc.id}|${mine}`, `<div class="fill ${mine ? "bad" : "good"}"><div class="bigword">${mine ? "It's you." : "You're fine."}</div>${lines.map((l) => `<p>${esc(l)}</p>`).join("")}<p class="hold">Hold up your phone.</p></div>`];
}

function joinView() {
  if (S.clash) {
    return ["clash|" + S.clash.id, `<h1>“${esc(S.clash.name)}” is already in the game</h1>
      <p>If that's someone else, pick a different name. Adding your last initial works.</p>
      <button class="primary" data-act="noclash">Pick a different name</button>
      <button class="plain" data-act="resume">That's me. I was already playing.</button>`];
  }
  return ["join|" + S.gameId + "|" + S.joinMsg, `<h1>Join the game</h1>
    <p>Type your first name or a nickname. It will show on the screen.</p>
    <input type="text" id="name" maxlength="16" autocomplete="off" autocapitalize="words" placeholder="Name">
    <p class="msg">${esc(S.joinMsg)}</p>
    <button class="primary" data-act="join">Join</button>`];
}

function questionView(q) {
  const mineForThis = S.answer && S.answer.q === (q.id || 1) ? S.answer.v : null;
  if (mineForThis !== null && !S.editAnswer) {
    return ["qdone|" + q.id + "|" + mineForThis, `<h1>${esc(q.prompt || "")}</h1>
      <p class="muted">Your answer</p><div class="big">${money(mineForThis)}</div>
      <button class="plain" data-act="editanswer">Change my answer</button>
      <p class="watch">Watch the screen.</p>`];
  }
  return ["q|" + q.id + "|" + S.editAnswer, `<h1>${esc(q.prompt || "")}</h1>
    <p>Type a dollar amount.</p>
    <input type="text" id="amount" inputmode="numeric" autocomplete="off" placeholder="$">
    <p class="msg" id="amsg"></p>
    <button class="primary" data-act="answer">Send</button>`];
}

function decadeView(d) {
  const dec = CONFIG.decades[d];
  const rec = (S.mine && S.mine[d]) || {};
  const picks = rec.picks || {};
  const allAnswered = dec.offers.every((o) => picks[o.id] === true || picks[o.id] === false);
  const yearly = yearlySaved(dec, picks);
  const before = myScore(d).savings;
  const key = `open|${d}|${JSON.stringify(picks)}|${!!rec.locked}|${before}`;

  if (rec.locked && !S.solo) {
    const list = dec.offers.map((o) => `<tr><td>${esc(o.name)}</td><td>${picks[o.id] ? "Bought" : "Skipped"}</td></tr>`).join("");
    return [key, `<h1>Locked in</h1>
      <div class="card"><table class="nums">${list}<tr class="total"><td>You save</td><td>${money(yearly)} a year</td></tr></table></div>
      <p class="watch">Waiting for the decade to end. Watch the screen.</p>
      <button class="plain" data-act="unlock" data-d="${d}">Change my choices</button>`];
  }

  const offers = dec.offers.map((o) => `
    <div class="card offer">
      <div class="top"><h2>${esc(o.name)}</h2><span class="price">${money(o.premium)} <small>a year</small></span></div>
      ${CONFIG.showCosts ? `<p>${esc(o.without)}</p><p>${esc(o.withIt)}</p>` : `<p>${esc(o.plain)}</p>`}
      <div class="seg">
        <button data-act="pick" data-d="${d}" data-o="${o.id}" data-v="1" class="${picks[o.id] === true ? "on" : ""}">Buy</button>
        <button data-act="pick" data-d="${d}" data-o="${o.id}" data-v="0" class="${picks[o.id] === false ? "on" : ""}">Skip</button>
      </div>
    </div>`).join("");

  return [key, `<h1>${esc(dec.title)}</h1>
    <p>${esc(dec.intro)}</p>
    ${d > 0 ? `<p class="muted">Total savings so far: <b${cls(before)}>${money(before)}</b></p>` : ""}
    <div class="card"><table class="nums">
      <tr><td>${esc(dec.payLabel)}</td><td>${money(dec.make)} a year</td></tr>
      <tr><td>Taxes and living</td><td>${money(dec.living)} a year</td></tr>
      <tr class="total"><td>You can save</td><td>${money(canSave(dec))} a year</td></tr>
    </table></div>
    <p class="pre">${esc(dec.already)}</p>
    ${offers}
    <div class="save"><span>With your choices you save</span><b>${money(yearly)} a year</b></div>
    <button class="primary" data-act="lock" data-d="${d}" ${allAnswered ? "" : "disabled"}>${allAnswered ? "Lock in" : "Choose Buy or Skip above"}</button>`];
}

function decadeLines(row) {
  let h = "";
  if (row.interest) h += `<tr><td>Interest on what you owed</td><td class="neg">${signed(row.interest)}</td></tr><tr class="sub"><td colspan="2">Debt doubles over ten years, which is about 7% a year.</td></tr>`;
  if (row.status === "skipped") {
    h += `<tr><td>A quiet decade. You saved ${money(row.yearly)} a year for ${CONFIG.years} years</td><td>${signed(row.saved)}</td></tr>`;
    return h;
  }
  h += `<tr><td>You saved ${money(row.yearly)} a year for ${CONFIG.years} years</td><td${cls(row.saved)}>${signed(row.saved)}</td></tr>`;
  if (row.status === "beforeJoin") {
    h += `<tr class="sub"><td colspan="2">You joined later, so this decade counts as buying everything.</td></tr>`;
    return h;
  }
  if (row.noAnswer && row.noAnswer.length) {
    const names = CONFIG.decades[row.d].offers.filter((o) => row.noAnswer.includes(o.id)).map((o) => o.short.toLowerCase()).join(" and ");
    h += `<tr class="sub"><td colspan="2">You didn't make a choice on ${esc(names)}, so it counts as bought.</td></tr>`;
  }
  if (!row.events.some((e) => e.big)) h += `<tr><td>Nothing big happened.</td><td></td></tr>`;
  row.events.forEach((e) => {
    h += `<tr><td>${esc(e.text)}</td><td${e.cost ? ' class="neg"' : ""}>${e.cost ? signed(-e.cost) : "$0"}</td></tr>`;
    const bill = e.bill ? `${esc(e.bill)}: ${money(e.fullCost)}. ` : "";
    const yours = e.cost ? ` and you ${esc(e.ownVerb)} ${money(e.cost)}${esc(e.ownTail)}${e.ownNote ? ` (${esc(e.ownNote.replace(/^their /, "your "))})` : ""}` : "";
    h += `<tr class="sub"><td colspan="2">${bill}${e.bought ? `You were insured, so the policy paid ${money(e.insurerPaid)}${yours}.` : `You weren't insured, so the whole cost is yours.`}</td></tr>`;
  });
  return h;
}

function resultView(d) {
  const sc = myScore(d + 1);
  const row = sc.decades[d];
  const dec = CONFIG.decades[d];
  const key = `closed|${d}|${JSON.stringify(row)}|${sc.paidIn}|${sc.gotBack}`;
  return [key, `<h1>${esc(dec.title)} are over</h1>
    <div class="card"><table class="nums">
      ${d > 0 ? `<tr><td>Total savings at ${CONFIG.decades[d - 1].endAge}</td><td${cls(sc.decades[d - 1].end)}>${money(sc.decades[d - 1].end)}</td></tr>` : ""}
      ${decadeLines(row)}
      <tr class="total"><td>Total savings at ${dec.endAge}</td><td${cls(sc.savings)}>${money(sc.savings)}</td></tr>
    </table></div>
    <p class="paid">Paid for insurance so far: <b>${money(sc.paidIn)}</b>. Received: <b>${money(sc.gotBack)}</b>.</p>
    ${S.solo ? `<button class="primary" data-act="solonext">${d + 1 < N_DECADES ? "Next decade" : "See how it ended"}</button>` : `<p class="watch">Watch the screen.</p>`}`];
}

function finalView() {
  const sc = myScore(closedCount(S.meta));
  const rows = sc.decades.map((r) => {
    const dec = CONFIG.decades[r.d];
    let what;
    if (r.status === "skipped") what = "A quiet decade";
    else if (r.status === "beforeJoin") what = "Before you joined";
    else {
      const na = r.noAnswer || [];
      const bought = dec.offers.filter((o) => r.picks[o.id] === true && !na.includes(o.id)).map((o) => o.short);
      const silent = dec.offers.filter((o) => na.includes(o.id)).map((o) => o.short);
      const hit = r.events.filter((e) => e.big).map((e) => e.text);
      const parts = [];
      if (bought.length) parts.push("Bought: " + bought.join(", "));
      else if (!silent.length) parts.push("Bought nothing");
      if (silent.length) parts.push("No choice made: " + silent.join(", ") + " (counted as bought)");
      what = parts.join("<br>") + (hit.length ? `<br><b>${esc(hit.join(" "))}</b>` : "");
    }
    return `<tr><td>${esc(dec.key)}</td><td>${what}</td><td${cls(r.end)}>${money(r.end)}</td></tr>`;
  }).join("");
  return ["final|" + JSON.stringify(sc.decades.map((r) => r.end)), `<h1>You're 60</h1>
    <p class="muted">Your total savings</p>
    <div class="big${sc.savings < 0 ? " neg" : ""}">${money(sc.savings)}</div>
    <div class="card"><table class="hist">
      <tr><th>Decade</th><th>What you did</th><th>Total savings</th></tr>${rows}
    </table></div>
    <div class="card"><table class="nums">
      <tr><td>You paid for insurance</td><td>${money(sc.paidIn)}</td></tr>
      <tr><td>Insurance paid you</td><td>${money(sc.gotBack)}</td></tr>
    </table></div>
    ${S.solo ? "" : `<p class="watch">Watch the screen.</p>`}`];
}

// ---------- taps and typing ----------
app.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  const d = Number(b.dataset.d);
  if (a === "join") join(document.getElementById("name").value);
  else if (a === "resume") resume(S.clash.id);
  else if (a === "noclash") { S.clash = null; render(); }
  else if (a === "rejoin") { store.del(pidKey(S.gameId)); mineStops.forEach((f) => f()); mineStops = []; S.pid = null; S.me = null; S.mine = null; render(); }
  else if (a === "pick") setPick(d, b.dataset.o, b.dataset.v === "1");
  else if (a === "lock") { setLocked(d, true); window.scrollTo(0, 0); }
  else if (a === "unlock") setLocked(d, false);
  else if (a === "editanswer") { S.editAnswer = true; render(); }
  else if (a === "solonext") soloNext();
  else if (a === "answer") {
    const n = Number(document.getElementById("amount").value.replace(/[^0-9]/g, ""));
    const raw = document.getElementById("amount").value.replace(/[^0-9]/g, "");
    if (!raw) { document.getElementById("amsg").textContent = "Type a dollar amount first."; return; }
    if (n > CONFIG.scene.stake) { document.getElementById("amsg").textContent = `You only have ${money(CONFIG.scene.stake)}.`; return; }
    sendAnswer(n);
  }
});
app.addEventListener("input", (ev) => {
  if (ev.target.id !== "amount") return;
  const digits = ev.target.value.replace(/[^0-9]/g, "").replace(/^0+(?=\d)/, "").slice(0, 9);
  ev.target.value = digits ? "$" + Number(digits).toLocaleString("en-US") : "";
});
app.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  if (ev.target.id === "name") join(ev.target.value);
  if (ev.target.id === "amount") app.querySelector('[data-act="answer"]').click();
});
</script>
